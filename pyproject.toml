[tool.pytest.ini_options]
# Put the project root on sys.path so `from src import ...` resolves the
# same way in CI as it does locally. Without this, pytest's rootdir
# autodetection may not add the root, and every test fails to import.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "perf: performance-regression guards (run with -m perf; deselect with -m 'not perf')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Real errors (pyflakes) and the important pycodestyle checks. Style-only
# preferences (import aliasing, blind-except) are intentionally off: the
# gate should catch bugs, not bikeshed.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length: CJK width makes this noisy and low-value
    "E741",  # ambiguous variable name (l for leg is fine here)
]
