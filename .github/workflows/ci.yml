name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint + test tools
        run: pip install ruff pytest pyjwt

      - name: Lint
        run: ruff check src tests eval

      # Unit tests only: the suite is designed to run without the vector
      # store or any model download (chunking, auth, guard, metrics, store).
      - name: Unit tests
        run: pytest tests/ -q
