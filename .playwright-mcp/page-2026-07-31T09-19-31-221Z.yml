          - generic [ref=e131]: "Osterode am Harz :: Ausflüge"
        - paragraph [ref=e132]: "Eine Tageswanderung ist der 11 km lange Weg (einfache Strecke) zur Hanskühnenburg auf dem Höhenzug Zum Acker im Nationalpark Harz. Daneben führen aber auch andere, kürzere Wege zur Hanskühnenburg, für die man zuerst mit Bus oder Auto an den Startpunkt fahren muss, wie z. B. nach Lonau bei Herzberg am Harz oder nach Sieber. In Clausthal-Zellerfeld, der Bergstadt mit weltbekannter bergbaulicher Universität und einer gut erhaltenen Altstadt mit den typischen Harzer Häusern lohnt insbesondere ein Besuch des Oberharzer Bergwerksmuseums. Herzberg am Harz, Osterodes Nachbarstadt am westlichen Harzrand wird vom oberhalb der Stadt liegenden, von weitem sichtbaren Welfenschloss dominiert. In Scharzfeld sind die Steinkirche und die Einhornhöhle besondere Sehenswürdigkeiten des kleinen Ortes am südwestlichen Harzrand. Im Winter zieht es Wintersportler vor allem in den Hochharz, z. B. auf Loipen, Pisten und Rodelhänge rund um Sankt Andreasberg. Im Sommer wie im Winter ist die kleine Siedlung Torfhaus ganz oben im Hochharz einen Besuch wert, für Wintersport und Wanderungen, und insbesondere als Startpunkt für den Goetheweg auf den Brocken. Die alte Universitätsstadt Göttingen etwa 25 km westlich vom Harz hat allerhand Sehenswürdigkeiten neben dem Gänseliesel, unter anderem die zahlreichen Forschungsstätten wie den Alten Botanischen Garten in der Stadt, die Wissen schafft. ## Weblinks Kategorie:Harz"
