          - generic [ref=e141]: "Mittelsächsisches Hügelland :: Sehenswürdigkeiten"
        - paragraph [ref=e142]: Das mittelsächsische Hügelland ist seit dem Mittelalter eine bedeutende Kulturlandschaft. Eine Vielzahl von Burgen, Schlössern, Klöstern und Kirchen ist in ihrer mittelalterlichen oder Renaissance-Form erhalten. Typisch für die Region sind zudem Klein- und Mittelstädte, deren Bild von gepflegten, rekonstruierten historischen Bauwerken und jeweils einem großen Marktplatz und meist prächtigem Rathaus im Zentrum geprägt ist. Im Folgenden nur eine Auswahl überregional bedeutender Höhepunkte. Details finden sich in den Subregionen bzw. Ortsartikeln. Burgen und Schlösser** Burg Gnandstein in Kohren-Sahlis – gut erhaltene spätromanische Höhenburg aus dem frühen 13. Jahrhundert Burg Kriebstein im Zschopautal bei Waldheim – bilderbuchartige Burg aus dem 14. Jahrhundert auf einem Felsen über dem Fluss, die gerne als Drehort für Märchen- und Historienfilme genutzt wird Schloss Colditz – 1000 Jahre alte Höhenburg, die zu einem Renaissanceschloss umgebaut wurde und während des Zweiten Weltkriegs Bekanntheit als Gefangenenlager für alliierte Offiziere erlangte Schloss Rochsburg bei Penig – Spornburg aus dem 12. Jahrhundert; während die Gesamtanlage und die Vorburg noch eine hochmittelalterliche Form aufweisen, wurde der Wohnbau zu einem komfortableren Renaissanceschloss umgebaut Schloss Wurzen – die spätgotische Anlage war von Anfang an als Schloss und nicht als Burg konzipiert, damit ist es eines der ältesten (reinen) Schlösser im deutschsprachigen Raum. Kirchen und Klöster**
