    - paragraph [ref=e157]: "根据提供的信息，哈茨地区（Harz）有多个城堡和景点值得一游： - 汉斯丘嫩堡 (Hanskühnenburg)：位于奥斯特罗德（Osterode am Harz），可以徒步到达。 - 费尔施洛斯 (Welfenschloss)：在赫尔茨贝格（Herzberg am Harz）附近，是该镇的标志性建筑。 - 格兰斯坦堡 (Burg Gnandstein)：位于科伦-萨利希（Kohren-Sahlis），是一座保存完好的晚期罗马式高地城堡。 - 克里布斯坦堡 (Burg Kriebstein)：在茨霍普瓦尔海姆（Zschopau）附近，是一个14世纪的岩石堡垒，常用于电影拍摄。 - 科洛施堡 (Schloss Rochsburg)：位于佩尼格（Penig），是一座中世纪要塞，后来被改建为文艺复兴时期的宫殿。 - 温岑堡 (Schloss Wurzen)：这座城堡自始至终都是作为住所而非堡垒建造的，是德语地区最古老的纯住宅之一。 来源: file :: Mittelsächsisches Hügelland :: Sehenswürdigkeiten"
