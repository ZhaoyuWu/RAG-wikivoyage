        - generic [ref=e33]: "Hohegeiß :: Unterkunft"
      - paragraph [ref=e34]: "- Campingplatz \"Am Bärenbache\", type: hotel, address: Bärenbachweg 10, 38700 Hohegeiß, phone: +49 55 83 13 06, url: https://www.campingplatz-hohegeiss.de - Hotel Rust, type: hotel, address: Am Brande 5, 38700 Hohegeiss, phone: +49 55 83 831, url: http://HotelRust-harz.de/ - New York Apartments, type: hotel, address: Am Kurpark 3, 38700 Hohegeiss, phone: +49 5171 583100, url: https://dasmerkichmir.de/, Facebook (auch Instagram) bitte nur Benutzername. - Ferienhaus Sonne, Harz & Sterne, type: hotel, address: Hubertusstraße 21 , 38700 Hohegeiß, directions: Panoramblick ins Bärenbachtal, phone: 05525959615, url: https://www.urlaubsdomizil-harz.de, price: ab 85 EUR, Das für die Harzregion einzigartige Ferienhaus wurde im dänischen Stil erbaut. Der ebenerdige Winkelbungalow mit seinem großzügigen Grundriss bietet genügend Platz und Raum und ist ideal für Paare und Familien mit 1-2 Kindern. Die liebevoll gestaltete Einrichtung wurde speziell auf die Bedürfnisse für eine Familie mit einem Baby bzw. Kleinkind abgestimmt."
