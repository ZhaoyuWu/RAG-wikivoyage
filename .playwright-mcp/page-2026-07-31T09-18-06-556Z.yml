        - paragraph [ref=e106]: "Hartha (9 km südlich, S 36) - die Stadt Hartha liegt 4 km westlich des Zschopautals; Stadtkirche und Sternwarte. Colditz (12 km südwestlich, S 44) - das Schloss Colditz war im Zweiten Weltkrieg ein Kriegsgefangenenlager, dessen prominentester Gefangener Winston Churchills Neffe Giles Romilly gewesen ist. Waldheim (14 km südlich, S 36 Ri. Hartha/Ortsumfahrung Hartha nach Querung der B 175) - sehenswertes Jugendstil-Rathaus direkt an der Zschopau. Südlich von Waldheim die Burg Kriebstein. Mügeln (15 km nordöstlich, S 31) - Unterwegsstation der Schmalspurbahn Wilder Robert Oschatz–Mügeln–Kemmlitz. Wermsdorf (17 km nördlich) - am Südrand des Wermsdorfer Waldes gelegen; Jagdschloss Hubertusburg. Döbeln (19 km östlich, S 34) - sehr schöne Innenstadt: saniert, weil das Hochwasser 2002 bis zu 2 m in der Stadt stand; sehr schönes Theater. Zwei Marktplätze und historische Straßenbahn. Grimma (22 km nordwestlich, S 36/S 38) - die nach Döbeln zweitgrößte Stadt im Mittelsächsischen Hügelland wartet besonders mit ihrer historischen Altstadt auf, die nach dem Hochwasser 2002 komplett saniert wurde. Wer es eiliger hat, benutzt die A 14."
