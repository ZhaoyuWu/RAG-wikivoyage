        - paragraph [ref=e101]: "Historische Altstadt · mit vielen sehenswerten Fachwerkhäusern Ev. Stadtkirche · gotisches Kirchengebäude mit erstmaliger Erwähnung im Jahr 812. Marktplatz · mit spätgotischem Rathaus, St. Georgsbrunnen und einigen schönen Fachwerkhäusern Bauten von 5 Burgen: · Vorderburg, Hinterburg, Hallenburg, Schachtenburg, Ottoburg - Hinterturm, type: building, price: Eintritt, Der 36 m hohe Turm besitzt eine Aussichtsplattform mit Aufzug. Vom Bauwerk hat man eine schöne Sicht auf die Stadt. In der Weihnachtszeit verwandelt sich der Turm in die größte Kerze der Welt. Der freundliche Aufzugsführer erzählt während der Fahrt wissenswertes zum Turm und zur Stadt Schlitz. Schloss Hallenburg: · Die Anlage besitzt einen sehenswerten Schlosspark. Das Schloss beherbergt die hessische Landesmusikakademie. Heimatmuseum · in der Vorderburg: Sammlung zur Stadtgeschichte; Ausstellung von Waffen, alten Büchern und Trachten"
