        - paragraph [ref=e111]: "Berge** - Bramberg, type: castle - ein erloschener Vulkankegel (495 m) mit der gleichnamigen Burgruine; Lage: ca. 2 km nordwestlich von Ebern, Stadtteil Dorf Bramberg; - Schwedenschanze, type: summit - auch Großer Hassberg (487), mit einem 28 m hohen Aussichtsturm und weitem Rundblick über die Haßberge und das nahe Grabfeld bis hin zu den angrenzenden Mittelgebirgen Steigerwald, Spessart, Rhön und Thüringer Wald. Achtung: Der Aussichtsturm ist nur zu den Öffnungszeiten der Dr.-Krahmer-Hütte am Turm zugänglich (siehe unten). Die Ringwallanlage der Kelten aus der Hallstadtzeit (um 500 v. Chr.) wurde auch noch im dreißigjährigen Krieg während der Schwedenbesatzung von den Einheimischen als Fliehburg genutzt, daher der Name; Dr.-Krahmer-Hütte, bewirtschaftet am Wochenende und an Feiertagen von 10.00 Uhr - 18.00 Uhr; Zeilberg (464 m) unmittelbar östlich vom Ort Maroldsweisach und Hausberg der Gemeinde: ein ehemaliger Vulkanberg mit Steinbruch, Lehrpfad und Zeiler Vulkanbiergarten; Judenhügel (415 m) (früher auch Wartberg) mit einem jüdischen Friedhof Innerhalb einer großen Ringwallanlage. Burgen und Schlösser** In der Region konzentrieren sich mehr als ein Drittel aller ehemaligen Ritter- und Adelssitze des burgenreichen Unterfrankens. Die Bettenburg gilt als das Wahrzeichen der Haßberge. Sie wurde 1535 durch Freiherr Truchseß von Wetzhausen erbaut, und ist heute noch im Besitz der Familie von Truchseß."