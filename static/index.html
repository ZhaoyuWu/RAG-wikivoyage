<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault RAG</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2330; --muted: #67707f;
    --accent: #2563eb; --accent-soft: #dbeafe; --border: #e3e6eb; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b202a; --text: #e8ebf0; --muted: #8b94a3;
      --accent: #60a5fa; --accent-soft: #1e3a5f; --border: #2a3140; --err: #f87171;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, "Segoe UI", sans-serif;
    max-width: 780px; margin: 0 auto; padding: 2rem 1rem 4rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: .2rem; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1.5rem; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
  select, input[type=text], input[type=datetime-local] {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: .55rem .75rem; font-size: .95rem;
  }
  #query { flex: 1; min-width: 220px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: .55rem 1.2rem; font-size: .95rem; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .modes label {
    padding: .5rem .9rem; cursor: pointer; font-size: .9rem; color: var(--muted);
    background: var(--card);
  }
  .modes input { display: none; }
  .modes input:checked + span { color: var(--accent); font-weight: 600; }
  .modes label:has(input:checked) { background: var(--accent-soft); }
  #status { color: var(--muted); font-size: .9rem; margin: 1rem 0; min-height: 1.4em; }
  #status.error { color: var(--err); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: .9rem 1.1rem; margin-bottom: .7rem;
  }
  .card .meta { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .35rem; }
  .score {
    background: var(--accent-soft); color: var(--accent); border-radius: 6px;
    font-size: .75rem; padding: .1rem .45rem; font-variant-numeric: tabular-nums;
  }
  .src { color: var(--muted); font-size: .82rem; }
  .card p { white-space: pre-wrap; overflow-wrap: anywhere; }
  #answer { border-left: 3px solid var(--accent); }
  .spin {
    display: inline-block; width: 1em; height: 1em; vertical-align: -0.15em;
    border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%;
    animation: r .8s linear infinite; margin-right: .4rem;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .trace { margin-top: 1rem; }
  .trace summary {
    cursor: pointer; color: var(--muted); font-size: .9rem;
    padding: .4rem 0; user-select: none;
  }
  .trace summary:hover { color: var(--accent); }
  #map {
    height: 340px; border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: .8rem; display: none;
  }
  #geobtn.active { background: var(--accent-soft); color: var(--accent); }
  #geobtn, #radius {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: .55rem .75rem; font-size: .9rem; cursor: pointer;
  }
  #radius { display: none; }
  .opt { display: flex; gap: .8rem; align-items: baseline; }
  .opt .dur { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .bubble-user {
    background: var(--accent-soft); border-color: transparent;
    margin-left: 20%; margin-top: 1.1rem;
  }
  #newchat {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: .55rem .75rem; cursor: pointer; font-size: .9rem;
  }
</style>
</head>
<body>
  <h1>Vault RAG</h1>
  <div class="sub">Hybrid retrieval over local collections. Ask in any language.</div>

  <div class="bar">
    <select id="collection" title="Collection"></select>
    <span class="modes">
      <label><input type="radio" name="mode" value="search" checked><span>Search</span></label>
      <label><input type="radio" name="mode" value="ask"><span>Ask</span></label>
      <label><input type="radio" name="mode" value="route"><span>Route</span></label>
      <label><input type="radio" name="mode" value="plan"><span>🗺️ Plan</span></label>
    </span>
    <input type="text" id="category" placeholder="category (optional)" size="14">
    <button id="geobtn" title="Filter results by map location">📍 near</button>
    <select id="radius">
      <option value="10">10 km</option>
      <option value="25">25 km</option>
      <option value="50" selected>50 km</option>
      <option value="100">100 km</option>
    </select>
  </div>
  <div class="bar" id="searchbar">
    <input type="text" id="query" placeholder="Type a question and press Enter" autofocus>
    <button id="go">Go</button>
    <button id="newchat" title="Clear conversation">↺ New</button>
    <button id="savechat" title="Save this conversation to the server">💾 Save</button>
    <select id="history" title="Load a saved conversation"><option value="">History…</option></select>
  </div>
  <div class="bar" id="routebar" style="display:none">
    <input type="text" id="from" placeholder="From (e.g. Essen)" size="16">
    <input type="text" id="to" placeholder="To (e.g. Berlin)" size="16">
    <select id="rmode">
      <option value="transit">🚆 Train</option>
      <option value="car">🚗 Drive</option>
    </select>
    <input type="datetime-local" id="departure" title="Departure time (transit only, empty = now)">
    <label id="alongwrap" title="Show detour-worthy stops along a drive (car only)">
      <input type="checkbox" id="along"> 顺路看
      <input type="text" id="alongwhat" placeholder="景点/城堡/美食" size="10" disabled>
    </label>
    <button id="goroute">Go</button>
  </div>

  <div id="map"></div>
  <div id="status"></div>
  <div id="results"></div>

  <div id="loginwrap" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:2000; align-items:center; justify-content:center">
    <div class="card" style="min-width:280px; background:var(--card)">
      <h3 style="margin:0 0 .8rem">Sign in</h3>
      <input id="lu" placeholder="Username" autocomplete="username" style="width:100%; margin-bottom:.5rem; padding:.5rem; border:1px solid var(--border); border-radius:8px">
      <input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%; margin-bottom:.6rem; padding:.5rem; border:1px solid var(--border); border-radius:8px">
      <button id="loginbtn" style="width:100%">Login</button>
      <div id="loginmsg" class="src" style="color:#dc2626; margin-top:.5rem"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

// ---- Auth ----
// With AUTH_ENABLED=0 on the server every request passes and this token
// simply stays unused.
let TOKEN = localStorage.getItem("vaultrag_token") || "";

async function api(url, opts = {}) {
  opts.headers = Object.assign({}, opts.headers,
    TOKEN ? { "Authorization": "Bearer " + TOKEN } : {});
  const resp = await fetch(url, opts);
  if (resp.status === 401) {
    $("loginwrap").style.display = "flex";
    throw new Error("Please log in.");
  }
  return resp;
}

async function doLogin() {
  const resp = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("lu").value, password: $("lp").value }),
  });
  const d = await resp.json().catch(() => ({}));
  if (!resp.ok) { $("loginmsg").textContent = d.detail || "Login failed"; return; }
  TOKEN = d.token;
  localStorage.setItem("vaultrag_token", TOKEN);
  $("loginwrap").style.display = "none";
  $("loginmsg").textContent = "";
  init();
}

// ---- Map ----
let map = null, poiLayer = null, geoLayer = null, routeLayer = null;
let geoFilter = null, picking = false;

function ensureMap() {
  $("map").style.display = "block";
  if (!map) {
    map = L.map("map").setView([51.16, 10.45], 6);  // Germany
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);
    poiLayer = L.layerGroup().addTo(map);
    geoLayer = L.layerGroup().addTo(map);
    routeLayer = L.layerGroup().addTo(map);
    map.on("click", e => {
      if (!picking) return;
      geoFilter = { lat: e.latlng.lat, lon: e.latlng.lng,
                    radius_km: parseFloat($("radius").value) };
      drawGeoFilter();
      status(`Location filter set (${geoFilter.radius_km} km radius). Run a search.`);
    });
  }
  setTimeout(() => map.invalidateSize(), 50);
}

function drawGeoFilter() {
  geoLayer.clearLayers();
  if (!geoFilter) return;
  L.circle([geoFilter.lat, geoFilter.lon], { radius: geoFilter.radius_km * 1000,
    color: "#2563eb", weight: 1.5, fillOpacity: 0.06 }).addTo(geoLayer);
  L.marker([geoFilter.lat, geoFilter.lon]).addTo(geoLayer);
}

function plotHits(hits) {
  const seen = new Set();
  const markers = [];
  hits.forEach(h => (h.pois || []).forEach(p => {
    if (seen.has(p.name)) return;
    seen.add(p.name);
    markers.push(L.marker([p.lat, p.lon])
      .bindPopup(`<b>${esc(p.name)}</b><br><small>${esc(h.file)}</small>`));
  }));
  if (!markers.length) return;
  ensureMap();
  poiLayer.clearLayers();
  markers.forEach(m => m.addTo(poiLayer));
  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.2), { maxZoom: 12 });
}
const status = (msg, isErr = false) => {
  $("status").innerHTML = msg;
  $("status").className = isErr ? "error" : "";
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadCollections() {
  try {
    const cols = await (await api("/collections")).json();
    $("collection").innerHTML = cols.map(c =>
      `<option value="${esc(c.name)}">${esc(c.name)} (${c.points.toLocaleString()})</option>`
    ).join("");
  } catch {
    status("Cannot reach the API. Is uvicorn running?", true);
  }
}

function renderHits(hits) {
  if (!hits.length) { $("results").innerHTML = ""; status("No results."); return; }
  $("results").innerHTML = hits.map(h => `
    <div class="card">
      <div class="meta">
        <span class="score">${h.score.toFixed(3)}</span>
        <span class="src">${esc(h.file)} :: ${esc(h.heading)}</span>
      </div>
      <p>${esc(h.text)}</p>
    </div>`).join("");
  plotHits(hits);
}

async function runRoute() {
  const from_place = $("from").value.trim();
  const to_place = $("to").value.trim();
  if (!from_place || !to_place) { status("Enter both places.", true); return; }
  $("results").innerHTML = "";

  if ($("along").checked) {          // detour-worthy stops along the drive
    status(`<span class="spin"></span>Finding stops along the way…`);
    const interests = $("alongwhat").value.trim().split(/[\s,，、]+/).filter(Boolean);
    const resp = await api("/plan/along", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from_place, to_place,
                             interests: interests.length ? interests : ["景点"] }),
    });
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.detail || resp.statusText);
    renderAlongResult(d, $("results"));
    status(`${d.from.name} → ${d.to.name}: ${d.stops.length} stop(s) within ${d.corridor_km} km of the route`);
    return;
  }

  status(`<span class="spin"></span>Routing…`);
  const resp = await api("/route", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ from_place, to_place, mode: $("rmode").value,
                           departure: $("departure").value || null }),
  });
  const d = await resp.json();
  if (!resp.ok) throw new Error(d.detail || resp.statusText);

  renderRouteResult(d, $("results"));
  status(`${d.from.name} → ${d.to.name}, ${d.options.length} option(s)`);
}

function renderAlongResult(d, container) {
  container.innerHTML = d.stops.length ? d.stops.map((s, i) => `
    <div class="card">
      <div class="opt">
        <span class="dur">+${s.detour_km} km</span>
        <span>${i + 1}. ${esc(s.file)}</span>
        <span class="src">${esc(s.heading)}</span>
      </div>
      <p>${esc(s.text)}</p>
    </div>`).join("")
    : `<div class="card"><p>路线两侧没有找到符合的顺路点,试试放宽兴趣。</p></div>`;

  ensureMap();
  routeLayer.clearLayers();
  poiLayer.clearLayers();
  const a = L.marker([d.from.lat, d.from.lon]).bindPopup("出发: " + esc(d.from.name));
  const b = L.marker([d.to.lat, d.to.lon]).bindPopup("到达: " + esc(d.to.name));
  a.addTo(routeLayer); b.addTo(routeLayer);
  if (d.geometry) {
    L.geoJSON(d.geometry, { style: { color: "#2563eb", weight: 4 } }).addTo(routeLayer);
  }
  // Detour stops as distinct pins off the main line.
  d.stops.forEach((s, i) => {
    if (s.geo) L.marker([s.geo.lat, s.geo.lon])
      .bindPopup(`${i + 1}. ${esc(s.file)} (+${s.detour_km} km)`).addTo(poiLayer);
  });
  const group = L.featureGroup([a, b,
    ...d.stops.filter(s => s.geo).map(s => L.marker([s.geo.lat, s.geo.lon]))]);
  map.fitBounds(group.getBounds().pad(0.2), { maxZoom: 11 });
}

function renderRouteCards(d, container) {
  container.innerHTML = d.options.map(o => `
    <div class="card">
      <div class="opt">
        <span class="dur">${Math.floor(o.duration_min / 60)}h ${o.duration_min % 60}m</span>
        <span>${esc(o.summary)}</span>
        ${o.transfers ? `<span class="src">${o.transfers} transfer(s)</span>` : ""}
      </div>
      ${(o.legs || []).map(l =>
        `<div class="src">• ${esc(l.line)}: ${esc(l.from)} → ${esc(l.to)}</div>`).join("")}
    </div>`).join("");
}

function renderRouteResult(d, container) {
  renderRouteCards(d, container);

  ensureMap();
  routeLayer.clearLayers();
  poiLayer.clearLayers();
  const a = L.marker([d.from.lat, d.from.lon]).bindPopup(esc(d.from.name));
  const b = L.marker([d.to.lat, d.to.lon]).bindPopup(esc(d.to.name));
  a.addTo(routeLayer); b.addTo(routeLayer);
  if (d.geometry) {
    L.geoJSON(d.geometry, { style: { color: "#2563eb", weight: 4 } }).addTo(routeLayer);
  } else {
    L.polyline([[d.from.lat, d.from.lon], [d.to.lat, d.to.lon]],
      { color: "#2563eb", weight: 2, dashArray: "6 8" }).addTo(routeLayer);
  }
  map.fitBounds(L.featureGroup([a, b]).getBounds().pad(0.25));
}

function traceSummaryLine(t) {
  const note = t.provider === "groq"
    ? "Answered by the cloud model (public-data collection); private notes always stay local."
    : "Generation dominates because a local model produces a handful of tokens per second on CPU.";
  return `Retrieval: <b>${t.retrieval_ms} ms</b> →
    ${t.chunks.length} chunks (${t.context_chars ? t.context_chars.toLocaleString() + " chars" : "no context"}) →
    ${esc(t.provider || "")}/${esc(t.model || "")} generated the answer in <b>${t.generation_s} s</b>.
    ${note}`;
}

let chatHistory = [];

// Conversation persistence: completed turns live in localStorage so a
// refresh restores the chat. Cleared by ↺ New or a collection switch.
const CHAT_KEY = "vaultrag_chat";
const PREF_KEY = "vaultrag_prefs";
let savedTurns = [];

function saveChat() {
  try {
    localStorage.setItem(CHAT_KEY, JSON.stringify({
      collection: $("collection").value, turns: savedTurns.slice(-30),
    }));
  } catch { /* storage full or blocked: persistence is best-effort */ }
}

function savePrefs() {
  const mode = document.querySelector("input[name=mode]:checked").value;
  localStorage.setItem(PREF_KEY,
    JSON.stringify({ mode, collection: $("collection").value }));
}

function loadJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch { return {}; }
}

function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== undefined) node.innerHTML = html;
  return node;
}

function newTurn(query) {
  const turn = el("div");
  turn.innerHTML = `
    <div class="card bubble-user"><p>${esc(query)}</p></div>
    <details class="trace" open>
      <summary>How this answer is being made</summary>
      <div class="src t-stats" style="margin:.6rem 0">Retrieving…</div>
      <div class="t-chunks"></div>
    </details>
    <div class="card t-answer" style="display:none"><p></p></div>
    <div class="card t-sources" style="display:none"></div>
    <div class="t-route"></div>`;
  return turn;
}

function chunkCards(chunks) {
  return chunks.map(c => `
    <div class="card">
      <div class="meta">
        <span class="score">${c.score.toFixed(3)}</span>
        <span class="src">${esc(c.file)} :: ${esc(c.heading)}</span>
      </div>
      <p>${esc(c.text)}</p>
    </div>`).join("");
}

function sourceLines(sources) {
  return sources.map(s =>
    `<div class="src">• ${esc(s.file)} :: ${esc(s.heading)}</div>`).join("");
}

function restoreTurn(t) {
  const turn = newTurn(t.query);
  const details = turn.querySelector("details");
  details.removeAttribute("open");
  details.querySelector("summary").textContent = "How this answer was made";
  turn.querySelector(".t-stats").innerHTML = t.trace ? traceSummaryLine(t.trace) : "";
  if (t.trace && t.trace.chunks)
    turn.querySelector(".t-chunks").innerHTML = chunkCards(t.trace.chunks);
  if (t.answer) {
    const a = turn.querySelector(".t-answer");
    a.style.display = "";
    a.querySelector("p").textContent = t.answer;
  }
  if (t.sources && t.sources.length) {
    const sc = turn.querySelector(".t-sources");
    sc.style.display = "";
    sc.innerHTML = sourceLines(t.sources);
  }
  if (t.route) renderRouteCards(t.route, turn.querySelector(".t-route"));
  $("results").prepend(turn);
}

function restoreChat() {
  const saved = loadJSON(CHAT_KEY);
  if (!saved.turns || saved.collection !== $("collection").value) return;
  savedTurns = saved.turns;
  for (const t of savedTurns) {
    restoreTurn(t);
    if (t.answer) {
      chatHistory.push({ role: "user", content: t.query });
      chatHistory.push({ role: "assistant", content: t.answer.slice(0, 2000) });
    }
  }
  if (savedTurns.length) status(`Restored ${savedTurns.length} turn(s).`);
}

async function runAskStream(body, t0) {
  // Chat style: newest turn first. Each turn is one wrapper holding the
  // user bubble and its answer block, prepended above older turns.
  const turn = newTurn(body.query);
  $("results").prepend(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
  let turnRoute = null;

  const stats = turn.querySelector(".t-stats");
  const answerCard = turn.querySelector(".t-answer");
  const answerText = answerCard.querySelector("p");
  const details = turn.querySelector("details");

  body.history = chatHistory.slice(-8);
  const timer = setInterval(() => status(
    `<span class="spin"></span>Working… ${Math.round((Date.now()-t0)/1000)}s`), 500);

  try {
    const resp = await api("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      throw new Error(d.detail || resp.statusText);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split("\n\n");
      buf = events.pop();
      for (const raw of events) {
        if (!raw.startsWith("data: ")) continue;
        const ev = JSON.parse(raw.slice(6));
        if (ev.type === "intent") {
          stats.innerHTML = `Detected a routing question: <b>${esc(ev.from_place)}</b> → <b>${esc(ev.to_place)}</b> (${ev.mode}). Querying routing services…`;
        } else if (ev.type === "rewrite") {
          stats.innerHTML = `Follow-up rewritten for retrieval (<b>${ev.rewrite_s}s</b>): “${esc(ev.query)}” — retrieving…`;
        } else if (ev.type === "retrieval") {
          const prefix = stats.innerHTML.startsWith("Follow-up") ? stats.innerHTML.split(" — ")[0] + " — " : "";
          stats.innerHTML = prefix +
            `retrieved <b>${ev.chunks.length}</b> chunks in <b>${ev.retrieval_ms} ms</b>, the model is now reading them…`;
          turn.querySelector(".t-chunks").innerHTML = chunkCards(ev.chunks);
        } else if (ev.type === "fallback") {
          stats.innerHTML += ` — cloud model unavailable (${esc(ev.detail)}), falling back to local <b>${esc(ev.provider)}</b>…`;
        } else if (ev.type === "guard") {
          stats.innerHTML = `⛔ Blocked by the input guard (${esc(ev.tier)}): ${esc(ev.reason)}`;
        } else if (ev.type === "low_confidence") {
          stats.innerHTML += ` — top relevance <b>${ev.top_score}</b> is below the ${ev.threshold} threshold, the corpus does not cover this…`;
        } else if (ev.type === "delta") {
          answerCard.style.display = "";
          answerText.textContent += ev.text;
        } else if (ev.type === "route") {
          turnRoute = ev.data;
          renderRouteResult(ev.data, turn.querySelector(".t-route"));
        } else if (ev.type === "done") {
          clearInterval(timer);
          answerCard.style.display = "";
          answerText.textContent = ev.answer;
          if (ev.sources.length) {
            const sc = turn.querySelector(".t-sources");
            sc.style.display = "";
            sc.innerHTML = sourceLines(ev.sources);
          }
          details.removeAttribute("open");
          details.querySelector("summary").textContent = "How this answer was made";
          if (ev.trace) stats.innerHTML = traceSummaryLine(ev.trace);
          status(`Done in ${((Date.now()-t0)/1000).toFixed(1)}s`);
          chatHistory.push({ role: "user", content: body.query });
          chatHistory.push({ role: "assistant", content: ev.answer.slice(0, 2000) });
          savedTurns.push({ query: body.query, answer: ev.answer,
                            sources: ev.sources, trace: ev.trace, route: turnRoute });
          saveChat();
          $("query").value = "";
        } else if (ev.type === "error") {
          throw new Error(ev.detail);
        }
      }
    }
  } finally {
    clearInterval(timer);
  }
}

const DAY_COLORS = ["#7c3aed", "#2563eb", "#059669", "#d97706", "#dc2626"];

function renderPlanRoute(origin, stops) {
  ensureMap();
  routeLayer.clearLayers();
  poiLayer.clearLayers();
  const all = [];
  if (origin) {
    L.marker([origin.lat, origin.lon]).bindPopup("出发: " + esc(origin.name)).addTo(routeLayer);
    all.push([origin.lat, origin.lon]);
  }
  // Group stops by day; each day gets its own colour and its own line from
  // the origin, so a multi-day plan reads as distinct daily loops.
  const byDay = {};
  stops.forEach(s => { if (s.geo) (byDay[s.day || 1] ||= []).push(s); });
  Object.keys(byDay).sort((a, b) => a - b).forEach(day => {
    const color = DAY_COLORS[(day - 1) % DAY_COLORS.length];
    const pts = origin ? [[origin.lat, origin.lon]] : [];
    byDay[day].forEach((s, i) => {
      L.marker([s.geo.lat, s.geo.lon])
        .bindPopup(`Day ${day} · ${i + 1}. ${esc(s.file)}`).addTo(routeLayer);
      pts.push([s.geo.lat, s.geo.lon]);
      all.push([s.geo.lat, s.geo.lon]);
    });
    if (pts.length > 1)
      L.polyline(pts, { color, weight: 3, dashArray: "6 8" }).addTo(routeLayer);
  });
  if (all.length > 1)
    map.fitBounds(L.polyline(all).getBounds().pad(0.2), { maxZoom: 11 });
}

async function runPlanStream(body, t0) {
  const results = $("results");
  const turn = el("div");
  turn.innerHTML = `
    <div class="card bubble-user"><p>${esc(body.query)}</p></div>
    <details class="trace" open>
      <summary>How this itinerary is being planned</summary>
      <div class="src t-stats" style="margin:.6rem 0">Planning…</div>
    </details>
    <div class="card t-answer" style="display:none"><p></p></div>`;
  results.prepend(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
  const stats = turn.querySelector(".t-stats");
  const answerCard = turn.querySelector(".t-answer");
  const answerText = answerCard.querySelector("p");

  const timer = setInterval(() => status(
    `<span class="spin"></span>Planning… ${Math.round((Date.now()-t0)/1000)}s`), 500);
  try {
    const resp = await api("/plan/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: body.query, collection: body.collection }),
    });
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      throw new Error(d.detail || resp.statusText);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", planOrigin = null;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split("\n\n");
      buf = events.pop();
      for (const raw of events) {
        if (!raw.startsWith("data: ")) continue;
        const ev = JSON.parse(raw.slice(6));
        if (ev.type === "parse") {
          planOrigin = ev.origin;
          stats.innerHTML = `Parsed: from <b>${esc(ev.origin)}</b>, ${ev.days} day(s), interests ${ev.likes.map(esc).join(", ")}${ev.excludes.length ? ", avoiding " + ev.excludes.map(esc).join(", ") : ""} — retrieving candidates…`;
        } else if (ev.type === "candidates") {
          stats.innerHTML += `<br>Found <b>${ev.count}</b> candidate places (${ev.sample.slice(0,5).map(esc).join(", ")}…) — clustering by distance…`;
        } else if (ev.type === "cluster") {
          const dayLines = ev.stops_per_day.map((day, i) =>
            `Day ${i + 1}: ${day.map(esc).join(" → ")}`).join("<br>");
          stats.innerHTML += `<br>Grouped into <b>${ev.days}</b> day(s):<br>${dayLines}<br>— computing travel times…`;
        } else if (ev.type === "routing") {
          const h = Math.floor(ev.total_travel_min / 60), m = ev.total_travel_min % 60;
          stats.innerHTML += `<br>Total travel <b>${h}h ${m}m</b> — writing the itinerary…`;
        } else if (ev.type === "delta") {
          answerCard.style.display = "";
          answerText.textContent += ev.text;
        } else if (ev.type === "done") {
          clearInterval(timer);
          answerCard.style.display = "";
          answerText.textContent = ev.answer;
          if (ev.stops && ev.stops.length) {
            renderPlanRoute(ev.origin || planOrigin, ev.stops);
          }
          turn.querySelector("details").removeAttribute("open");
          turn.querySelector("summary").textContent = "How this itinerary was planned";
          if (ev.trace) {
            const days = ev.trace.days || 1;
            stats.innerHTML = `Planned ${days} day(s), ${ev.trace.stops} stops from ${ev.trace.candidates} candidates, ${Math.floor(ev.trace.total_travel_min/60)}h ${ev.trace.total_travel_min%60}m total travel, via ${esc(ev.trace.provider)}/${esc(ev.trace.model)}.`;
          }
          status(`Done in ${((Date.now()-t0)/1000).toFixed(1)}s`);
          // Make the itinerary saveable/exportable like a conversation.
          savedTurns.push({
            query: body.query, answer: ev.answer,
            sources: (ev.stops || []).map(s => ({ file: s.file, heading: s.heading })),
          });
          saveChat();
          $("query").value = "";
        } else if (ev.type === "error") {
          throw new Error(ev.detail);
        }
      }
    }
  } finally {
    clearInterval(timer);
  }
}

async function run() {
  const mode = document.querySelector("input[name=mode]:checked").value;
  if (mode === "route") {
    $("go").disabled = true;
    try { await runRoute(); }
    catch (e) { status("Error: " + esc(e.message), true); }
    finally { $("go").disabled = false; }
    return;
  }
  const query = $("query").value.trim();
  if (!query) return;
  const body = {
    query,
    top_k: 5,
    collection: $("collection").value || null,
    category: $("category").value.trim() || null,
    geo: geoFilter,
  };
  $("go").disabled = true;
  if (mode !== "ask") $("results").innerHTML = "";  // ask mode accumulates a conversation
  const t0 = Date.now();
  try {
    if (mode === "ask") {
      await runAskStream(body, t0);
    } else if (mode === "plan") {
      await runPlanStream(body, t0);
    } else {
      status(`<span class="spin"></span>Searching…`);
      const resp = await api("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || resp.statusText);
      status(`Done in ${((Date.now()-t0)/1000).toFixed(1)}s`);
      renderHits(data);
    }
  } catch (e) {
    status("Error: " + esc(e.message), true);
  } finally {
    $("go").disabled = false;
  }
}

$("go").onclick = run;
$("goroute").onclick = () => run();
$("query").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("to").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

// "顺路看" only makes sense for a drive (needs the route geometry). Ticking it
// enables the interest box and forces car mode.
$("along").addEventListener("change", e => {
  $("alongwhat").disabled = !e.target.checked;
  if (e.target.checked) { $("rmode").value = "car"; $("rmode").disabled = true; }
  else { $("rmode").disabled = false; }
});
$("alongwhat").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

document.querySelectorAll("input[name=mode]").forEach(r =>
  r.addEventListener("change", () => {
    if (!r.checked) return;
    const isRoute = r.value === "route";
    $("searchbar").style.display = isRoute ? "none" : "flex";
    $("routebar").style.display = isRoute ? "flex" : "none";
    $("query").placeholder = r.value === "plan"
      ? "描述行程,如:从 Essen 出发一天,想看城堡和徒步,不要夜店"
      : "Type a question and press Enter";
    if (isRoute || r.value === "plan") ensureMap();
  }));

$("geobtn").onclick = () => {
  if (geoFilter || picking) {           // clear
    geoFilter = null; picking = false;
    $("geobtn").classList.remove("active");
    $("radius").style.display = "none";
    if (geoLayer) geoLayer.clearLayers();
    status("Location filter cleared.");
  } else {                              // arm picking
    picking = true;
    $("geobtn").classList.add("active");
    $("radius").style.display = "";
    ensureMap();
    status("Click the map to set the search center.");
  }
};
$("radius").onchange = () => {
  if (geoFilter) {
    geoFilter.radius_km = parseFloat($("radius").value);
    drawGeoFilter();
  }
};

function resetChat() {
  chatHistory = [];
  savedTurns = [];
  localStorage.removeItem(CHAT_KEY);
  $("results").innerHTML = "";
  status("New conversation.");
}
$("newchat").onclick = resetChat;
$("loginbtn").onclick = doLogin;
$("lp").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

// ---- Server-side conversations ----
async function saveConversation() {
  if (!savedTurns.length) { status("Nothing to save yet."); return; }
  const messages = [];
  for (const t of savedTurns) {
    if (!t.answer) continue;
    messages.push({ role: "user", content: t.query });
    messages.push({ role: "assistant", content: t.answer,
      sources: (t.sources || []).map(s => `${s.file} :: ${s.heading}`).join("; ") });
  }
  const title = savedTurns[savedTurns.length - 1].query.slice(0, 40);
  const resp = await api("/conversations", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ collection: $("collection").value, title, messages }),
  });
  const d = await resp.json();
  // Offer the markdown export so a plan or chat can flow back into the vault.
  const url = "/conversations/" + d.id + "/export";
  $("status").innerHTML = `Saved as #${d.id}. ` +
    `<a href="#" id="exportlink">Export markdown</a> to fold it back into your notes.`;
  const link = document.getElementById("exportlink");
  if (link) link.onclick = async (e) => {
    e.preventDefault();
    const r = await api(url);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `plan-${d.id}.md`;
    a.click();
  };
  loadHistory();
}

async function loadHistory() {
  try {
    const list = await (await api("/conversations")).json();
    $("history").innerHTML = '<option value="">History…</option>' +
      list.map(c => `<option value="${c.id}">${esc(c.title)} · ${c.updated_at.slice(5, 16).replace("T", " ")}</option>`).join("");
  } catch { /* not logged in yet */ }
}

async function openConversation(cid) {
  const d = await (await api("/conversations/" + cid)).json();
  resetChat();
  for (const m of d.messages) {
    if (m.role === "user") {
      savedTurns.push({ query: m.content, answer: "", sources: [] });
    } else if (savedTurns.length) {
      const t = savedTurns[savedTurns.length - 1];
      t.answer = m.content;
      t.sources = (m.sources || "").split("; ").filter(Boolean).map(s => {
        const [file, heading] = s.split(" :: ");
        return { file, heading: heading || "" };
      });
    }
  }
  $("results").innerHTML = "";
  for (const t of savedTurns) {
    restoreTurn(t);
    chatHistory.push({ role: "user", content: t.query });
    chatHistory.push({ role: "assistant", content: (t.answer || "").slice(0, 2000) });
  }
  saveChat();
  status(`Loaded conversation #${cid}. Add to it, or ↺ New to start fresh.`);
}

$("savechat").onclick = () => saveConversation().catch(e => status("Error: " + esc(e.message), true));
$("history").onchange = e => { if (e.target.value) openConversation(e.target.value); };
$("collection").addEventListener("change", () => { resetChat(); savePrefs(); });
document.querySelectorAll("input[name=mode]").forEach(r =>
  r.addEventListener("change", savePrefs));

async function init() {
  const prefs = loadJSON(PREF_KEY);
  if (prefs.mode) {
    const radio = document.querySelector(`input[name=mode][value="${prefs.mode}"]`);
    if (radio && !radio.checked) radio.click();
  }
  await loadCollections();
  // Setting the value directly avoids the change handler, which resets the chat.
  if (prefs.collection &&
      [...$("collection").options].some(o => o.value === prefs.collection)) {
    $("collection").value = prefs.collection;
  }
  restoreChat();
  loadHistory();
}
init();
</script>
