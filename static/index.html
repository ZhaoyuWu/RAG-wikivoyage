<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault RAG</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1a2233; --muted: #667080;
    --accent: #2563eb; --accent-2: #6d5ae0; --accent-soft: #e5edfc;
    --border: #e2e7ef; --err: #b91c1c;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1319; --card: #181e29; --text: #e8ebf0; --muted: #8b94a3;
      --accent: #60a5fa; --accent-2: #9d8cf5; --accent-soft: #1e3a5f;
      --border: #28303f; --err: #f87171;
      --shadow: 0 1px 3px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, "Segoe UI", sans-serif;
    padding: 1.4rem 1.4rem 2.5rem;
  }
  /* App layout, edge to edge: the chat pane keeps a readable width, the
     map takes every remaining pixel of the window. Sticky + viewport-high,
     so the conversation scrolls beside a pinned map. */
  #layout { display: flex; gap: 1.2rem; align-items: flex-start; }
  /* Map hidden (X-ray, or before first use): the chat breathes wider AND
     sits centred, so an ultrawide window frames it instead of dwarfing it. */
  #layout:not(.with-map) { justify-content: center; }
  #chatpane { flex: 1; min-width: 0; max-width: 1100px; }
  #layout.with-map #chatpane { flex: 0 0 min(46%, 720px); max-width: none; }
  @media (max-width: 980px) {
    /* Stacked: map first (it is the context), conversation below. */
    #layout { flex-direction: column-reverse; align-items: stretch; }
    #layout.with-map #chatpane { flex: none; }
  }
  header { margin-bottom: 1.1rem; }
  /* The collection select sits with the mode pills: both scope the query.
     Styled like the segmented control so the row reads as one instrument. */
  #collection {
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: .55rem .8rem; font-weight: 600; color: var(--muted);
    max-width: 15rem;
  }
  h1 {
    font-size: 1.5rem; letter-spacing: -.01em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    width: fit-content;
  }
  .sub { color: var(--muted); font-size: .85rem; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .7rem; align-items: center; }
  select, input[type=text], input[type=datetime-local] {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: .55rem .75rem; font-size: .95rem;
  }
  input:focus-visible, select:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  input[type=checkbox] { accent-color: var(--accent); }
  #query { flex: 1; min-width: 220px; padding: .65rem .9rem; }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: 0; border-radius: 10px;
    padding: .55rem 1.2rem; font-size: .95rem; cursor: pointer;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: wait; }
  button.ghost, select.ghost {
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border);
  }
  button.ghost:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  .modes {
    display: inline-flex; gap: 2px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 3px; box-shadow: var(--shadow);
  }
  .modes label {
    padding: .45rem .95rem; cursor: pointer; font-size: .9rem; color: var(--muted);
    border-radius: 9px; transition: background .15s, color .15s;
  }
  .modes label:hover { color: var(--text); }
  .modes input { display: none; }
  .modes input:checked + span { color: var(--accent); font-weight: 600; }
  .modes label:has(input:checked) { background: var(--accent-soft); }
  #status { color: var(--muted); font-size: .9rem; margin: 1rem 0; min-height: 1.4em; }
  #status.error { color: var(--err); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: .9rem 1.1rem; margin-bottom: .7rem; box-shadow: var(--shadow);
  }
  .card .meta { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .35rem; }
  .score {
    background: var(--accent-soft); color: var(--accent); border-radius: 6px;
    font-size: .75rem; padding: .1rem .45rem; font-variant-numeric: tabular-nums;
  }
  .src { color: var(--muted); font-size: .82rem; }
  .card p { white-space: pre-wrap; overflow-wrap: anywhere; }
  #answer { border-left: 3px solid var(--accent); }
  .spin {
    display: inline-block; width: 1em; height: 1em; vertical-align: -0.15em;
    border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%;
    animation: r .8s linear infinite; margin-right: .4rem;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .trace { margin-top: 1rem; }
  .trace summary {
    cursor: pointer; color: var(--muted); font-size: .9rem;
    padding: .4rem 0; user-select: none;
  }
  .trace summary:hover { color: var(--accent); }
  /* Retrieval X-ray */
  .xray-cols { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: .8rem; margin-top: .6rem; }
  @media (max-width: 720px) { .xray-cols { grid-template-columns: 1fr; } }
  .xray-col h4 { margin: 0 0 .5rem; font-size: .85rem; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; }
  .xray-row { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: .4rem .55rem; margin-bottom: .4rem; font-size: .82rem; display: flex;
    align-items: baseline; gap: .5rem; }
  .xray-rank { background: var(--border); color: var(--text); border-radius: 5px;
    padding: .05rem .4rem; font-size: .72rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .xray-file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xray-move { font-size: .72rem; color: var(--muted); flex-shrink: 0; }
  .xray-promoted { color: #16a34a; font-weight: 600; }
  .xray-note { color: var(--muted); font-size: .82rem; margin: .3rem 0 .8rem; }
  .xray-badge { background: #16a34a22; color: #16a34a; border-radius: 5px;
    padding: .05rem .4rem; font-size: .7rem; margin-left: .3rem; }
  #map {
    flex: 1; min-width: 0;
    position: sticky; top: 1rem; height: calc(100vh - 2rem);
    border-radius: var(--radius); border: 1px solid var(--border);
    display: none; box-shadow: var(--shadow);
  }
  @media (max-width: 980px) {
    #map { position: static; height: 340px; flex: none; width: 100%; margin-bottom: .8rem; }
  }
  #filterbar { font-size: .9rem; }
  #filterbar .flabel { color: var(--muted); font-size: .82rem; }
  #geobtn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #geobtn, #radius {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    border-radius: 10px; padding: .45rem .7rem; font-size: .88rem; cursor: pointer;
  }
  #geobtn:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  #radius { display: none; }
  #category { padding: .45rem .7rem; font-size: .88rem; width: 10.5rem; }
  .opt { display: flex; gap: .8rem; align-items: baseline; }
  .opt .dur { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .bubble-user {
    background: var(--accent-soft); border-color: transparent;
    margin-left: 20%; margin-top: 1.1rem;
  }
  #chattools { display: inline-flex; gap: .5rem; }
  #chattools button, #chattools select {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    border-radius: 10px; padding: .55rem .75rem; cursor: pointer; font-size: .9rem;
  }
  #chattools button:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  /* One control height across the input row, so nothing looks misaligned. */
  #searchbar input, #searchbar button, #searchbar select { height: 44px; }
  /* Empty state: a centred invitation with one example per pipeline. */
  #hero { text-align: center; padding: 9vh 1rem 1.5rem; }
  #hero h2 { font-size: 1.45rem; font-weight: 650; letter-spacing: -.015em; margin-bottom: .45rem; }
  #hero p { color: var(--muted); font-size: .92rem; margin-bottom: 1.6rem; }
  .chips { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  .chip {
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: .5rem 1rem; font-size: .88rem; box-shadow: var(--shadow);
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  /* Photos (Wikimedia, fetched by the browser) and Maps deep links */
  .hitcard { display: flex; gap: .9rem; align-items: flex-start; }
  .hitcard .thumbbox { flex-shrink: 0; }
  .hitcard .thumb {
    width: 112px; height: 84px; object-fit: cover; display: block;
    border-radius: 8px; border: 1px solid var(--border);
  }
  .hitcard .hitbody { min-width: 0; flex: 1; }
  .gmap { color: var(--muted); font-size: .78rem; text-decoration: none; white-space: nowrap; }
  .gmap:hover { color: var(--accent); }
  .stoprow { display: flex; gap: .6rem; overflow-x: auto; padding: .2rem 0 .6rem; }
  .stopfig { flex: 0 0 150px; margin: 0; }
  .stopfig img {
    width: 150px; height: 100px; object-fit: cover; display: block;
    border-radius: 10px; border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .stopfig figcaption {
    font-size: .72rem; color: var(--muted); margin-top: .2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Popup photo strip: up to three photos share a fixed row; a single
     photo takes the full width. The strip claims its width from the start
     so Leaflet measures the bubble around it — photos arrive async, and a
     bubble measured text-wide would overflow. Pulsing placeholder while
     loading; zero photos just collapse to zero height. */
  .popimg { display: flex; gap: 4px; margin-top: .4rem; width: 276px; }
  .popimg img {
    flex: 1; min-width: 0; height: 88px; object-fit: cover; display: block;
    border-radius: 8px;
  }
  .popimg.loading {
    min-height: 88px; border-radius: 8px;
    background: var(--accent-soft); animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .4; } }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Vault RAG</h1>
      <div class="sub">Hybrid retrieval over local collections. Ask in any language.</div>
    </div>
  </header>

  <!-- Chat pane left, map right (sticky, full height); stacked on narrow
       screens. When the map is hidden (X-ray) the chat takes the full width. -->
  <div id="layout">
  <div id="chatpane">
  <!-- Auto is the conversation (it routes each query to answering, planning
       or reach search by itself); the three pills beside it are tools with
       controls of their own: timetable routing, reachability painting,
       retrieval X-ray. -->
  <div class="bar">
    <select id="collection" title="Collection to query"></select>
    <span class="modes">
      <label><input type="radio" name="mode" value="auto" checked><span>✨ Auto</span></label>
      <label><input type="radio" name="mode" value="route"><span>🚆 Route</span></label>
      <label><input type="radio" name="mode" value="reach"><span>🎨 Reach</span></label>
      <label><input type="radio" name="mode" value="xray"><span>🔬 X-ray</span></label>
    </span>
  </div>
  <div class="bar" id="searchbar">
    <input type="text" id="query" autofocus
           placeholder="Ask anything — a question, a trip (“day trip around Essen”), a reach (“castles within 90 min”)">
    <button id="go">Go</button>
    <span id="chattools">
      <button id="newchat" title="Clear conversation">↺</button>
      <button id="savechat" title="Save this conversation to the server">💾</button>
      <select id="history" title="Load a saved conversation"><option value="">History…</option></select>
    </span>
  </div>
  <!-- Retrieval filters: they scope the Auto conversation only. -->
  <div class="bar" id="filterbar">
    <span class="flabel">Filters</span>
    <input type="text" id="category" placeholder="category, e.g. 工作">
    <button id="geobtn" title="Constrain retrieval to a circle on the map">📍 near</button>
    <select id="radius">
      <option value="10">10 km</option>
      <option value="25">25 km</option>
      <option value="50" selected>50 km</option>
      <option value="100">100 km</option>
    </select>
  </div>
  <div class="bar" id="routebar" style="display:none">
    <input type="text" id="from" placeholder="From (e.g. Essen)" size="16">
    <input type="text" id="to" placeholder="To (e.g. Berlin)" size="16">
    <select id="rmode">
      <option value="transit">🚆 Train</option>
      <option value="car">🚗 Drive</option>
    </select>
    <input type="datetime-local" id="departure" title="Departure time (transit only, empty = now)">
    <label id="alongwrap" title="Show detour-worthy stops along a drive (car only)">
      <input type="checkbox" id="along"> stops along the way
      <input type="text" id="alongwhat" placeholder="castles / food / 景点" size="12" disabled>
    </label>
    <button id="goroute">Go</button>
  </div>
  <div class="bar" id="reachbar" style="display:none">
    <input type="text" id="reachfrom" placeholder="Centre (e.g. Essen) — or click the map" size="20">
    <select id="reachmin" title="Drive-time budget">
      <option value="30">≤30 min</option>
      <option value="60">≤60 min</option>
      <option value="90" selected>≤90 min</option>
      <option value="120">≤120 min</option>
    </select>
    <input type="text" id="reachq" placeholder="What to find, e.g. Burgen / 徒步" size="22">
    <button id="goreachq">Search</button>
    <button id="goreach" class="ghost" title="Just paint the reachability bands">🎨 Paint</button>
  </div>

  <div id="hero" style="display:none">
    <h2>Ask your corpus anything</h2>
    <p>Questions get cited answers · trip wishes become day plans · drive-time budgets become maps</p>
    <div class="chips">
      <button class="chip">What is worth seeing in Goslar?</button>
      <button class="chip">essen周边1日游,开车,想看城堡</button>
      <button class="chip">Essen出发90分钟车程内的城堡</button>
    </div>
  </div>
  <div id="status"></div>
  <div id="results"></div>
  </div><!-- /chatpane -->
  <div id="map"></div>
  </div><!-- /layout -->

  <div id="loginwrap" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:2000; align-items:center; justify-content:center">
    <div class="card" style="min-width:280px; background:var(--card)">
      <h3 style="margin:0 0 .8rem">Sign in</h3>
      <input id="lu" placeholder="Username" autocomplete="username" style="width:100%; margin-bottom:.5rem; padding:.5rem; border:1px solid var(--border); border-radius:8px">
      <input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%; margin-bottom:.6rem; padding:.5rem; border:1px solid var(--border); border-radius:8px">
      <button id="loginbtn" style="width:100%">Login</button>
      <div id="loginmsg" class="src" style="color:#dc2626; margin-top:.5rem"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

// ---- Auth ----
// With AUTH_ENABLED=0 on the server every request passes and this token
// simply stays unused.
let TOKEN = localStorage.getItem("vaultrag_token") || "";

async function api(url, opts = {}) {
  opts.headers = Object.assign({}, opts.headers,
    TOKEN ? { "Authorization": "Bearer " + TOKEN } : {});
  const resp = await fetch(url, opts);
  if (resp.status === 401) {
    $("loginwrap").style.display = "flex";
    throw new Error("Please log in.");
  }
  return resp;
}

async function doLogin() {
  const resp = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("lu").value, password: $("lp").value }),
  });
  const d = await resp.json().catch(() => ({}));
  if (!resp.ok) { $("loginmsg").textContent = d.detail || "Login failed"; return; }
  TOKEN = d.token;
  localStorage.setItem("vaultrag_token", TOKEN);
  $("loginwrap").style.display = "none";
  $("loginmsg").textContent = "";
  init();
}

// ---- Photos: Wikimedia thumbnails, fetched by the BROWSER only ----
// The corpus is Wikivoyage, so its own article titles resolve to page images
// (the wikivoyage banner, else the wikipedia lead image); POIs without a page
// fall back to the nearest Commons photo by coordinate. No keys, no backend
// involvement: only a title or a coordinate ever leaves the browser.
const photoCache = new Map();

async function wikiPhotos(title, geo, want = 3) {
  const key = `${title || ""}|${geo ? geo.lat + "," + geo.lon : ""}|${want}`;
  if (photoCache.has(key)) return photoCache.get(key);

  const pageImage = host => title
    ? fetch(`https://${host}/w/api.php?action=query&format=json&origin=*`
        + `&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=480`
        + `&titles=${encodeURIComponent(title)}`)
      .then(r => r.json())
      .then(d => {
        const page = Object.values((d.query || {}).pages || {})[0];
        return page && page.thumbnail ? [page.thumbnail.source] : [];
      }).catch(() => [])
    : Promise.resolve([]);

  const commonsNearby = geo
    ? fetch(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*`
        + `&generator=geosearch&ggscoord=${geo.lat}%7C${geo.lon}&ggsradius=500`
        + `&ggslimit=${want}&ggsnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=480`)
      .then(r => r.json())
      .then(d => Object.values((d.query || {}).pages || {})
        .filter(p => p.imageinfo && p.imageinfo[0])
        .map(p => p.imageinfo[0].thumburl || p.imageinfo[0].url))
      .catch(() => [])
    : Promise.resolve([]);

  // All three sources race in parallel; results keep the priority order
  // (page image first, nearby Commons photos fill the rest), deduped by
  // file name so the same Commons file via two projects counts once.
  const promise = Promise.all([
    pageImage("de.wikivoyage.org"), pageImage("de.wikipedia.org"), commonsNearby,
  ]).then(lists => {
    const seen = new Set();
    const out = [];
    for (const url of lists.flat()) {
      const name = url.split("/").pop().replace(/^\d+px-/, "");
      if (seen.has(name)) continue;
      seen.add(name);
      out.push(url);
      if (out.length >= want) break;
    }
    return out;
  });
  photoCache.set(key, promise);
  return promise;
}

// Single-photo convenience for card thumbnails and the plan strip.
const wikiThumb = (title, geo) => wikiPhotos(title, geo, 1).then(a => a[0] || null);

// Hovering a pin opens its popup (and thereby lazy-loads its photo); click
// still works. Leaflet closes the previous popup when the next one opens.
const hoverPopup = m => m.on("mouseover", () => m.openPopup());

const gmapsLink = (lat, lon) =>
  `<a class="gmap" target="_blank" rel="noopener" `
  + `href="https://www.google.com/maps?q=${lat},${lon}">Maps ↗</a>`;

// ---- Map ----
let map = null, poiLayer = null, geoLayer = null, routeLayer = null, reachLayer = null;
let geoFilter = null, picking = false;

// Reachability bands: nearest is greenest, farthest fades to amber-red.
const REACH_COLORS = ["#16a34a", "#84cc16", "#f59e0b", "#ef4444"];
const REACH_LABELS = ["≤30 min", "≤60 min", "≤90 min", "≤120 min"];

function ensureMap() {
  $("map").style.display = "block";
  $("layout").classList.add("with-map");
  if (!map) {
    map = L.map("map").setView([51.16, 10.45], 6);  // Germany
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);
    poiLayer = L.layerGroup().addTo(map);
    geoLayer = L.layerGroup().addTo(map);
    routeLayer = L.layerGroup().addTo(map);
    reachLayer = L.layerGroup().addTo(map);
    // Any popup carrying a .popimg placeholder gets its photo lazily, on
    // first open, so pins stay cheap until someone actually looks.
    map.on("popupopen", e => {
      const box = e.popup.getElement().querySelector(".popimg");
      if (!box || box.dataset.done) return;
      box.dataset.done = "1";
      box.classList.add("loading");
      const geo = box.dataset.lat
        ? { lat: +box.dataset.lat, lon: +box.dataset.lon } : null;
      wikiPhotos(box.dataset.title || null, geo, 3).then(urls => {
        box.classList.remove("loading");
        // Just append — never popup.update(): Leaflet re-renders string
        // content from scratch on update, which would wipe these images
        // (and the done flag) right after they load. The CSS fixes the
        // strip size, so the popup grows without re-measuring.
        urls.forEach(src => {
          const img = new Image();
          img.alt = "";
          img.src = src;
          box.appendChild(img);
        });
      });
    });
    map.on("click", e => {
      // In Reach mode, a map click sets the isochrone centre and paints.
      if (document.querySelector("input[name=mode]:checked").value === "reach") {
        runIsochrone({ lat: e.latlng.lat, lon: e.latlng.lng });
        return;
      }
      if (!picking) return;
      geoFilter = { lat: e.latlng.lat, lon: e.latlng.lng,
                    radius_km: parseFloat($("radius").value) };
      drawGeoFilter();
      status(`Location filter set (${geoFilter.radius_km} km radius). Ask anything.`);
    });
  }
  setTimeout(() => map.invalidateSize(), 50);
}

function drawGeoFilter() {
  geoLayer.clearLayers();
  if (!geoFilter) return;
  L.circle([geoFilter.lat, geoFilter.lon], { radius: geoFilter.radius_km * 1000,
    color: "#2563eb", weight: 1.5, fillOpacity: 0.06 }).addTo(geoLayer);
  L.marker([geoFilter.lat, geoFilter.lon]).addTo(geoLayer);
}

// ---- Reachability isochrone ----
let reachLegend = null;

function paintIsochrone(data, maxMinutes) {
  reachLayer.clearLayers();
  // Each grid sample becomes a square sized to exactly meet its neighbours
  // (half the grid spacing, from the backend), so the cells tile into
  // continuous reachability bands instead of separate dots. When a search
  // budget is given, only paint up to it: the paint IS the constraint.
  const dLat = (data.cell && data.cell.lat) || 0.17;
  const dLon = (data.cell && data.cell.lon) || 0.25;
  const points = maxMinutes ? data.points.filter(p => p.minutes <= maxMinutes)
                            : data.points;
  points.forEach(p => {
    L.rectangle(
      [[p.lat - dLat, p.lon - dLon], [p.lat + dLat, p.lon + dLon]],
      { color: REACH_COLORS[p.band], weight: 0, fillColor: REACH_COLORS[p.band],
        fillOpacity: 0.42 }
    ).bindTooltip(`${p.minutes} min drive`).addTo(reachLayer);
  });
  const c = data.center;
  L.marker([c.lat, c.lon]).bindTooltip(esc(c.name || "centre"), { permanent: false })
    .addTo(reachLayer);
  map.setView([c.lat, c.lon], 8);

  // Legend, added once.
  if (reachLegend) map.removeControl(reachLegend);
  reachLegend = L.control({ position: "bottomright" });
  reachLegend.onAdd = () => {
    const div = L.DomUtil.create("div");
    div.style.cssText = "background:var(--card); padding:.5rem .7rem; border-radius:8px;"
      + "box-shadow:0 1px 6px rgba(0,0,0,.2); font-size:.8rem; line-height:1.6";
    const nBands = maxMinutes
      ? Math.max(1, data.bands.filter(b => b <= maxMinutes).length)
      : REACH_LABELS.length;
    div.innerHTML = "<b>Drive time</b><br>" + REACH_LABELS.slice(0, nBands).map((lab, i) =>
      `<span style="display:inline-block;width:12px;height:12px;background:${REACH_COLORS[i]};`
      + `border-radius:2px;margin-right:6px;vertical-align:middle"></span>${lab}`
    ).join("<br>");
    return div;
  };
  reachLegend.addTo(map);
}

async function runIsochrone(center) {
  ensureMap();
  const body = center
    ? { lat: center.lat, lon: center.lon, grid_n: 14 }
    : { place: $("reachfrom").value.trim(), grid_n: 14 };
  if (!body.place && body.lat === undefined) {
    status("Enter a centre place or click the map.", true);
    return;
  }
  $("goreach").disabled = true;
  status(`<span class="spin"></span>Painting reachability…`);
  try {
    const resp = await api("/isochrone", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.statusText);
    if (!data.points.length) {
      status("No reachable area found — is the centre on the road network?", true);
      return;
    }
    paintIsochrone(data);
    lastReachCenter = data.center;
    $("reachfrom").value = data.center.name || $("reachfrom").value;
    status(`Painted ${data.points.length} reachable cells from ${esc(data.center.name || "centre")}.`);
  } catch (e) {
    status("Error: " + esc(e.message), true);
  } finally {
    $("goreach").disabled = false;
  }
}

// ---- Reach search: retrieval filtered by real driving time ----
let lastReachCenter = null;

const bandForMin = m => {
  const edges = [30, 60, 90, 120];
  for (let i = 0; i < edges.length; i++) if (m <= edges[i]) return i;
  return edges.length - 1;
};

async function runReachSearch(opts = {}) {
  // opts {query, minutes, place} override the Reach bar widgets, so the
  // Auto mode can dispatch here with parameters extracted from the text.
  const query = (opts.query !== undefined ? opts.query : $("reachq").value).trim();
  if (!query) { status("Enter what to look for, e.g. Burgen.", true); return; }
  const minutes = opts.minutes || parseInt($("reachmin").value, 10);
  const place = (opts.place !== undefined ? opts.place : $("reachfrom").value).trim();
  const centre = place ? { place } :
    lastReachCenter ? { lat: lastReachCenter.lat, lon: lastReachCenter.lon } : null;
  if (!centre) { status("Set a centre first: type a place or click the map.", true); return; }

  ensureMap();
  $("goreachq").disabled = true;
  status(`<span class="spin"></span>Searching within ${minutes} min drive…`);
  try {
    // Paint and search in parallel; each costs one OSRM call.
    const post = (url, body) => api(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const [isoResp, resp] = await Promise.all([
      post("/isochrone", { ...centre, grid_n: 14 }),
      post("/reach/search", { query, minutes, top_k: 8, ...centre,
                              collection: $("collection").value }),
    ]);
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.detail || resp.statusText);
    const isoData = await isoResp.json().catch(() => null);
    if (isoResp.ok && isoData && isoData.points.length) paintIsochrone(isoData, minutes);
    lastReachCenter = d.center;
    $("reachfrom").value = d.center.name || $("reachfrom").value;
    renderReachHits(d);
    status(`${d.hits.length} of ${d.considered} candidates truly within ${minutes} min of `
      + `${esc(d.center.name)} — ${d.dropped} sat inside the ${d.radius_km} km circle `
      + `but are not reachable by road in time.`);
  } catch (e) {
    status("Error: " + esc(e.message), true);
  } finally {
    $("goreachq").disabled = false;
  }
}

function renderReachHits(d) {
  $("results").innerHTML = d.hits.length ? d.hits.map((h, i) => `
    <div class="card hitcard">
      <span class="thumbbox" style="display:none"><img class="thumb" alt="" loading="lazy" data-i="${i}"></span>
      <div class="hitbody">
        <div class="meta">
          <span class="dur">🚗 ${h.drive_min} min</span>
          <span class="score">${h.score.toFixed(3)}</span>
          <span class="src">${esc(h.file)} :: ${esc(h.heading)}</span>
          ${h.geo ? gmapsLink(h.geo.lat, h.geo.lon) : ""}
        </div>
        <p>${esc(h.text)}</p>
      </div>
    </div>`).join("")
    : `<div class="card"><p>Nothing reachable within ${d.minutes} min — try a bigger budget.</p></div>`;
  $("results").querySelectorAll("img.thumb").forEach(img => {
    const h = d.hits[+img.dataset.i];
    wikiThumb(h.file, h.geo).then(src => {
      if (!src) return;
      img.src = src;
      img.closest(".thumbbox").style.display = "";
    });
  });

  // Pins coloured by each point's own time band; the dashed circle shows what
  // a naive straight-line filter would have claimed as "within reach".
  poiLayer.clearLayers();
  // interactive:false — this ring is pure annotation; it must never swallow
  // clicks meant for the pins beneath it (its tooltip moved to the legend
  // line in #status instead).
  L.circle([d.center.lat, d.center.lon], { radius: d.radius_km * 1000,
    color: "#64748b", weight: 1.5, dashArray: "6 6", fillOpacity: 0,
    interactive: false }).addTo(poiLayer);
  const seen = new Set();
  d.hits.forEach(h => {
    const pts = (h.pois && h.pois.length) ? h.pois
      : (h.geo ? [{ name: h.file, lat: h.geo.lat, lon: h.geo.lon,
                    drive_min: h.drive_min }] : []);
    pts.forEach(p => {
      if (seen.has(p.name)) return;
      seen.add(p.name);
      hoverPopup(L.circleMarker([p.lat, p.lon], {
        radius: 7, color: "#ffffff", weight: 1.5,
        fillColor: REACH_COLORS[bandForMin(p.drive_min)], fillOpacity: .95,
      }).bindPopup(`<b>${esc(p.name)}</b><br>🚗 ${p.drive_min} min · ${gmapsLink(p.lat, p.lon)}<br>`
                   + `<small>${esc(h.file)}</small>`
                   + `<div class="popimg" data-title="${esc(p.name)}" data-lat="${p.lat}" data-lon="${p.lon}"></div>`)
        .addTo(poiLayer));
    });
  });
}

const status = (msg, isErr = false) => {
  $("status").innerHTML = msg;
  $("status").className = isErr ? "error" : "";
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadCollections() {
  try {
    const cols = await (await api("/collections")).json();
    $("collection").innerHTML = cols.map(c =>
      `<option value="${esc(c.name)}">${esc(c.name)} (${c.points.toLocaleString()})</option>`
    ).join("");
  } catch {
    status("Cannot reach the API. Is uvicorn running?", true);
  }
}

async function runRoute() {
  const from_place = $("from").value.trim();
  const to_place = $("to").value.trim();
  if (!from_place || !to_place) { status("Enter both places.", true); return; }
  $("results").innerHTML = "";

  if ($("along").checked) {          // detour-worthy stops along the drive
    status(`<span class="spin"></span>Finding stops along the way…`);
    const interests = $("alongwhat").value.trim().split(/[\s,，、]+/).filter(Boolean);
    const resp = await api("/plan/along", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from_place, to_place,
                             interests: interests.length ? interests : ["景点"] }),
    });
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.detail || resp.statusText);
    renderAlongResult(d, $("results"));
    status(`${d.from.name} → ${d.to.name}: ${d.stops.length} stop(s) within ${d.corridor_km} km of the route`);
    return;
  }

  status(`<span class="spin"></span>Routing…`);
  const resp = await api("/route", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ from_place, to_place, mode: $("rmode").value,
                           departure: $("departure").value || null }),
  });
  const d = await resp.json();
  if (!resp.ok) throw new Error(d.detail || resp.statusText);

  renderRouteResult(d, $("results"));
  status(`${d.from.name} → ${d.to.name}, ${d.options.length} option(s)`);
}

function renderAlongResult(d, container) {
  container.innerHTML = d.stops.length ? d.stops.map((s, i) => `
    <div class="card">
      <div class="opt">
        <span class="dur">+${s.detour_km} km</span>
        <span>${i + 1}. ${esc(s.file)}</span>
        <span class="src">${esc(s.heading)}</span>
      </div>
      <p>${esc(s.text)}</p>
    </div>`).join("")
    : `<div class="card"><p>No detour-worthy stops found along this route — try broader interests.</p></div>`;

  ensureMap();
  routeLayer.clearLayers();
  poiLayer.clearLayers();
  const a = L.marker([d.from.lat, d.from.lon]).bindPopup("From: " + esc(d.from.name));
  const b = L.marker([d.to.lat, d.to.lon]).bindPopup("To: " + esc(d.to.name));
  a.addTo(routeLayer); b.addTo(routeLayer);
  if (d.geometry) {
    L.geoJSON(d.geometry, { style: { color: "#2563eb", weight: 4 } }).addTo(routeLayer);
  }
  // Detour stops as distinct pins off the main line.
  d.stops.forEach((s, i) => {
    if (!s.geo) return;
    const pin = L.marker([s.geo.lat, s.geo.lon])
      .bindPopup(`${i + 1}. ${esc(s.file)} (+${s.detour_km} km) · ${gmapsLink(s.geo.lat, s.geo.lon)}`
                 + `<div class="popimg" data-title="${esc(s.file)}" data-lat="${s.geo.lat}" data-lon="${s.geo.lon}"></div>`)
      .addTo(poiLayer);
    hoverPopup(pin);
  });
  const group = L.featureGroup([a, b,
    ...d.stops.filter(s => s.geo).map(s => L.marker([s.geo.lat, s.geo.lon]))]);
  map.fitBounds(group.getBounds().pad(0.2), { maxZoom: 11 });
}

function renderRouteCards(d, container) {
  container.innerHTML = d.options.map(o => `
    <div class="card">
      <div class="opt">
        <span class="dur">${Math.floor(o.duration_min / 60)}h ${o.duration_min % 60}m</span>
        <span>${esc(o.summary)}</span>
        ${o.transfers ? `<span class="src">${o.transfers} transfer(s)</span>` : ""}
      </div>
      ${(o.legs || []).map(l =>
        `<div class="src">• ${esc(l.line)}: ${esc(l.from)} → ${esc(l.to)}</div>`).join("")}
    </div>`).join("");
}

function renderRouteResult(d, container) {
  renderRouteCards(d, container);

  ensureMap();
  routeLayer.clearLayers();
  poiLayer.clearLayers();
  const a = L.marker([d.from.lat, d.from.lon]).bindPopup(esc(d.from.name));
  const b = L.marker([d.to.lat, d.to.lon]).bindPopup(esc(d.to.name));
  a.addTo(routeLayer); b.addTo(routeLayer);
  if (d.geometry) {
    L.geoJSON(d.geometry, { style: { color: "#2563eb", weight: 4 } }).addTo(routeLayer);
  } else {
    L.polyline([[d.from.lat, d.from.lon], [d.to.lat, d.to.lon]],
      { color: "#2563eb", weight: 2, dashArray: "6 8" }).addTo(routeLayer);
  }
  map.fitBounds(L.featureGroup([a, b]).getBounds().pad(0.25));
}

function traceSummaryLine(t) {
  const note = t.provider === "groq"
    ? "Answered by the cloud model (public-data collection); private notes always stay local."
    : "Generation dominates because a local model produces a handful of tokens per second on CPU.";
  return `Retrieval: <b>${t.retrieval_ms} ms</b> →
    ${t.chunks.length} chunks (${t.context_chars ? t.context_chars.toLocaleString() + " chars" : "no context"}) →
    ${esc(t.provider || "")}/${esc(t.model || "")} generated the answer in <b>${t.generation_s} s</b>.
    ${note}`;
}

let chatHistory = [];

// Conversation persistence: completed turns live in localStorage so a
// refresh restores the chat. Cleared by ↺ New or a collection switch.
const CHAT_KEY = "vaultrag_chat";
const PREF_KEY = "vaultrag_prefs";
let savedTurns = [];

function saveChat() {
  try {
    localStorage.setItem(CHAT_KEY, JSON.stringify({
      collection: $("collection").value, turns: savedTurns.slice(-30),
    }));
  } catch { /* storage full or blocked: persistence is best-effort */ }
}

function savePrefs() {
  const mode = document.querySelector("input[name=mode]:checked").value;
  localStorage.setItem(PREF_KEY,
    JSON.stringify({ mode, collection: $("collection").value }));
}

function loadJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch { return {}; }
}

function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== undefined) node.innerHTML = html;
  return node;
}

function newTurn(query) {
  const turn = el("div");
  turn.innerHTML = `
    <div class="card bubble-user"><p>${esc(query)}</p></div>
    <details class="trace" open>
      <summary>How this answer is being made</summary>
      <div class="src t-stats" style="margin:.6rem 0">Retrieving…</div>
      <div class="t-chunks"></div>
    </details>
    <div class="card t-answer" style="display:none"><p></p></div>
    <div class="card t-sources" style="display:none"></div>
    <div class="t-route"></div>`;
  return turn;
}

function chunkCards(chunks) {
  return chunks.map(c => `
    <div class="card">
      <div class="meta">
        <span class="score">${c.score.toFixed(3)}</span>
        <span class="src">${esc(c.file)} :: ${esc(c.heading)}</span>
      </div>
      <p>${esc(c.text)}</p>
    </div>`).join("");
}

function sourceLines(sources) {
  return sources.map(s =>
    `<div class="src">• ${esc(s.file)} :: ${esc(s.heading)}</div>`).join("");
}

// ---- Retrieval X-ray ----
function legRows(rows) {
  return rows.map(r =>
    `<div class="xray-row"><span class="xray-rank">#${r.rank + 1}</span>` +
    `<span class="xray-file" title="${esc(r.file)}">${esc(r.file)}</span></div>`
  ).join("") || `<div class="xray-note">(none)</div>`;
}

function fusedRows(rows) {
  return rows.map(r => {
    // Show where this result stood in each leg, and flag when fusion pulled it
    // up from a weak position in BOTH legs. This must match the backend's
    // `promotions` definition exactly (retrieval.py): a result counts as
    // rescued only when it appears in both legs and its BETTER leg rank is
    // still worse than its final rank. A null rank means "not in that leg's
    // top-k" — that is not a rescue, so a missing leg disqualifies the badge.
    const d = r.dense_rank === null ? "–" : "#" + (r.dense_rank + 1);
    const s = r.sparse_rank === null ? "–" : "#" + (r.sparse_rank + 1);
    const promoted = r.dense_rank !== null && r.sparse_rank !== null &&
      Math.min(r.dense_rank, r.sparse_rank) > r.final_rank;
    return `<div class="xray-row" title="dense ${d}, sparse ${s}` +
      (promoted ? " — rescued by fusion from a weak leg position" : "") + `">` +
      `<span class="xray-rank">#${r.final_rank + 1}</span>` +
      `<span class="xray-file">${esc(r.file)}` +
      (promoted ? `<span class="xray-badge">↑</span>` : "") +
      `</span>` +
      `<span class="xray-move ${promoted ? "xray-promoted" : ""}">d${d}·s${s}</span>` +
      `</div>`;
  }).join("") || `<div class="xray-note">(none)</div>`;
}

function renderXray(data) {
  const st = data.stages;
  const exp = data.expanded_query
    ? `Query expanded to “${esc(data.expanded_query)}” before retrieval. ` : "";
  const note = `${exp}Dense recalled ${st.dense_candidates}, sparse recalled ${st.sparse_candidates}. `
    + `${st.reranker_on ? "Reranker ON" : "Reranker off"} — ${esc(st.sigmoid_note)}. `
    + (st.promotions ? `<b>${st.promotions}</b> result(s) rescued by fusion/rerank from a weak leg position.`
                     : "");
  $("results").innerHTML = `
    <div class="card">
      <div class="xray-note">${note}</div>
      <div class="xray-cols">
        <div class="xray-col"><h4>Dense (bge-m3)</h4>${legRows(data.dense)}</div>
        <div class="xray-col"><h4>Sparse (BM25)</h4>${legRows(data.sparse)}</div>
        <div class="xray-col"><h4>Fused → ${st.reranker_on ? "Reranked" : "RRF"}</h4>${fusedRows(data.fused)}</div>
      </div>
    </div>`;
}

async function runXray() {
  const query = $("query").value.trim();
  if (!query) return;
  $("go").disabled = true;
  status(`<span class="spin"></span>Tracing retrieval…`);
  try {
    const resp = await api("/trace", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, top_k: 8, collection: $("collection").value || null }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.statusText);
    renderXray(data);
    status("Retrieval pipeline traced. Dense, sparse, and the fused/reranked result side by side.");
  } catch (e) {
    status("Error: " + esc(e.message), true);
  } finally {
    $("go").disabled = false;
  }
}

function restoreTurn(t) {
  const turn = newTurn(t.query);
  const details = turn.querySelector("details");
  details.removeAttribute("open");
  details.querySelector("summary").textContent = "How this answer was made";
  turn.querySelector(".t-stats").innerHTML = t.trace ? traceSummaryLine(t.trace) : "";
  if (t.trace && t.trace.chunks)
    turn.querySelector(".t-chunks").innerHTML = chunkCards(t.trace.chunks);
  if (t.answer) {
    const a = turn.querySelector(".t-answer");
    a.style.display = "";
    a.querySelector("p").textContent = t.answer;
  }
  if (t.sources && t.sources.length) {
    const sc = turn.querySelector(".t-sources");
    sc.style.display = "";
    sc.innerHTML = sourceLines(t.sources);
  }
  if (t.route) renderRouteCards(t.route, turn.querySelector(".t-route"));
  $("results").prepend(turn);
}

// The hero invitation shows only where a conversation could start: Auto
// mode with nothing said yet. Any turn, restore, or mode change re-decides.
function updateHero() {
  const mode = document.querySelector("input[name=mode]:checked").value;
  $("hero").style.display =
    (mode === "auto" && !savedTurns.length && !$("results").innerHTML) ? "" : "none";
}

function restoreChat() {
  const saved = loadJSON(CHAT_KEY);
  if (!saved.turns || saved.collection !== $("collection").value) return;
  savedTurns = saved.turns;
  for (const t of savedTurns) {
    restoreTurn(t);
    if (t.answer) {
      chatHistory.push({ role: "user", content: t.query });
      chatHistory.push({ role: "assistant", content: t.answer.slice(0, 2000) });
    }
  }
  if (savedTurns.length) status(`Restored ${savedTurns.length} turn(s).`);
  updateHero();
}

async function runAskStream(body, t0) {
  // Chat style: newest turn first. Each turn is one wrapper holding the
  // user bubble and its answer block, prepended above older turns.
  const turn = newTurn(body.query);
  $("results").prepend(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
  let turnRoute = null;

  const stats = turn.querySelector(".t-stats");
  const answerCard = turn.querySelector(".t-answer");
  const answerText = answerCard.querySelector("p");
  const details = turn.querySelector("details");

  body.history = chatHistory.slice(-8);
  const timer = setInterval(() => status(
    `<span class="spin"></span>Working… ${Math.round((Date.now()-t0)/1000)}s`), 500);

  try {
    const resp = await api("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      throw new Error(d.detail || resp.statusText);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split("\n\n");
      buf = events.pop();
      for (const raw of events) {
        if (!raw.startsWith("data: ")) continue;
        const ev = JSON.parse(raw.slice(6));
        if (ev.type === "intent") {
          stats.innerHTML = `Detected a routing question: <b>${esc(ev.from_place)}</b> → <b>${esc(ev.to_place)}</b> (${ev.mode}). Querying routing services…`;
        } else if (ev.type === "rewrite") {
          stats.innerHTML = `Follow-up rewritten for retrieval (<b>${ev.rewrite_s}s</b>): “${esc(ev.query)}” — retrieving…`;
        } else if (ev.type === "retrieval") {
          const prefix = stats.innerHTML.startsWith("Follow-up") ? stats.innerHTML.split(" — ")[0] + " — " : "";
          stats.innerHTML = prefix +
            `retrieved <b>${ev.chunks.length}</b> chunks in <b>${ev.retrieval_ms} ms</b>, the model is now reading them…`;
          turn.querySelector(".t-chunks").innerHTML = chunkCards(ev.chunks);
        } else if (ev.type === "fallback") {
          stats.innerHTML += ` — cloud model unavailable (${esc(ev.detail)}), falling back to local <b>${esc(ev.provider)}</b>…`;
        } else if (ev.type === "guard") {
          stats.innerHTML = `⛔ Blocked by the input guard (${esc(ev.tier)}): ${esc(ev.reason)}`;
        } else if (ev.type === "low_confidence") {
          stats.innerHTML += ` — top relevance <b>${ev.top_score}</b> is below the ${ev.threshold} threshold, the corpus does not cover this…`;
        } else if (ev.type === "delta") {
          answerCard.style.display = "";
          answerText.textContent += ev.text;
        } else if (ev.type === "route") {
          turnRoute = ev.data;
          renderRouteResult(ev.data, turn.querySelector(".t-route"));
        } else if (ev.type === "done") {
          clearInterval(timer);
          answerCard.style.display = "";
          answerText.textContent = ev.answer;
          if (ev.sources.length) {
            const sc = turn.querySelector(".t-sources");
            sc.style.display = "";
            sc.innerHTML = sourceLines(ev.sources);
          }
          details.removeAttribute("open");
          details.querySelector("summary").textContent = "How this answer was made";
          if (ev.trace) stats.innerHTML = traceSummaryLine(ev.trace);
          status(`Done in ${((Date.now()-t0)/1000).toFixed(1)}s`);
          chatHistory.push({ role: "user", content: body.query });
          chatHistory.push({ role: "assistant", content: ev.answer.slice(0, 2000) });
          savedTurns.push({ query: body.query, answer: ev.answer,
                            sources: ev.sources, trace: ev.trace, route: turnRoute });
          saveChat();
          $("query").value = "";
        } else if (ev.type === "error") {
          throw new Error(ev.detail);
        }
      }
    }
  } finally {
    clearInterval(timer);
  }
}

const DAY_COLORS = ["#7c3aed", "#2563eb", "#059669", "#d97706", "#dc2626"];

function renderPlanRoute(origin, stops) {
  ensureMap();
  routeLayer.clearLayers();
  poiLayer.clearLayers();
  const all = [];
  if (origin) {
    L.marker([origin.lat, origin.lon]).bindPopup("From: " + esc(origin.name)).addTo(routeLayer);
    all.push([origin.lat, origin.lon]);
  }
  // Group stops by day; each day gets its own colour and its own line from
  // the origin, so a multi-day plan reads as distinct daily loops.
  const byDay = {};
  stops.forEach(s => { if (s.geo) (byDay[s.day || 1] ||= []).push(s); });
  Object.keys(byDay).sort((a, b) => a - b).forEach(day => {
    const color = DAY_COLORS[(day - 1) % DAY_COLORS.length];
    const pts = origin ? [[origin.lat, origin.lon]] : [];
    byDay[day].forEach((s, i) => {
      hoverPopup(L.marker([s.geo.lat, s.geo.lon])
        .bindPopup(`Day ${day} · ${i + 1}. ${esc(s.file)} · ${gmapsLink(s.geo.lat, s.geo.lon)}`
                   + `<div class="popimg" data-title="${esc(s.file)}" data-lat="${s.geo.lat}" data-lon="${s.geo.lon}"></div>`)
        .addTo(routeLayer));
      pts.push([s.geo.lat, s.geo.lon]);
      all.push([s.geo.lat, s.geo.lon]);
    });
    if (pts.length > 1)
      L.polyline(pts, { color, weight: 3, dashArray: "6 8" }).addTo(routeLayer);
  });
  if (all.length > 1)
    map.fitBounds(L.polyline(all).getBounds().pad(0.2), { maxZoom: 11 });
}

async function runPlanStream(body, t0) {
  const results = $("results");
  const turn = el("div");
  turn.innerHTML = `
    <div class="card bubble-user"><p>${esc(body.query)}</p></div>
    <details class="trace" open>
      <summary>How this itinerary is being planned</summary>
      <div class="src t-stats" style="margin:.6rem 0">Planning…</div>
    </details>
    <div class="card t-answer" style="display:none"><p></p></div>`;
  results.prepend(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
  const stats = turn.querySelector(".t-stats");
  const answerCard = turn.querySelector(".t-answer");
  const answerText = answerCard.querySelector("p");

  const timer = setInterval(() => status(
    `<span class="spin"></span>Planning… ${Math.round((Date.now()-t0)/1000)}s`), 500);
  try {
    const resp = await api("/plan/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: body.query, collection: body.collection,
                             history: chatHistory.slice(-8) }),
    });
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      throw new Error(d.detail || resp.statusText);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", planOrigin = null;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split("\n\n");
      buf = events.pop();
      for (const raw of events) {
        if (!raw.startsWith("data: ")) continue;
        const ev = JSON.parse(raw.slice(6));
        if (ev.type === "parse") {
          planOrigin = ev.origin;
          stats.innerHTML = `Parsed: from <b>${esc(ev.origin)}</b>, ${ev.days} day(s), interests ${ev.likes.map(esc).join(", ")}${ev.excludes.length ? ", avoiding " + ev.excludes.map(esc).join(", ") : ""} — retrieving candidates…`;
        } else if (ev.type === "candidates") {
          stats.innerHTML += `<br>Found <b>${ev.count}</b> candidate places (${ev.sample.slice(0,5).map(esc).join(", ")}…) — clustering by distance…`;
        } else if (ev.type === "cluster") {
          const dayLines = ev.stops_per_day.map((day, i) =>
            `Day ${i + 1}: ${day.map(esc).join(" → ")}`).join("<br>");
          stats.innerHTML += `<br>Grouped into <b>${ev.days}</b> day(s):<br>${dayLines}<br>— computing travel times…`;
        } else if (ev.type === "routing") {
          const h = Math.floor(ev.total_travel_min / 60), m = ev.total_travel_min % 60;
          stats.innerHTML += `<br>Total travel <b>${h}h ${m}m</b> — writing the itinerary…`;
        } else if (ev.type === "delta") {
          answerCard.style.display = "";
          answerText.textContent += ev.text;
        } else if (ev.type === "done") {
          clearInterval(timer);
          answerCard.style.display = "";
          answerText.textContent = ev.answer;
          if (ev.stops && ev.stops.length) {
            renderPlanRoute(ev.origin || planOrigin, ev.stops);
            // A photo strip of the stops, day-coloured like the map lines.
            const strip = el("div");
            strip.className = "stoprow";
            strip.innerHTML = ev.stops.map((s, i) => `
              <figure class="stopfig">
                <img alt="" loading="lazy" data-i="${i}"
                     style="border-bottom: 3px solid ${DAY_COLORS[((s.day || 1) - 1) % DAY_COLORS.length]}">
                <figcaption>Day ${s.day} · ${esc(s.file)}</figcaption>
              </figure>`).join("");
            turn.appendChild(strip);
            strip.querySelectorAll("img").forEach(img => {
              const s = ev.stops[+img.dataset.i];
              wikiThumb(s.file, s.geo).then(src => {
                if (src) img.src = src;
                else img.closest("figure").remove();
              });
            });
          }
          turn.querySelector("details").removeAttribute("open");
          turn.querySelector("summary").textContent = "How this itinerary was planned";
          if (ev.trace) {
            const days = ev.trace.days || 1;
            stats.innerHTML = `Planned ${days} day(s), ${ev.trace.stops} stops from ${ev.trace.candidates} candidates, ${Math.floor(ev.trace.total_travel_min/60)}h ${ev.trace.total_travel_min%60}m total travel, via ${esc(ev.trace.provider)}/${esc(ev.trace.model)}.`;
          }
          status(`Done in ${((Date.now()-t0)/1000).toFixed(1)}s`);
          // Feed the plan into the conversation memory so the next message
          // ("那改成开车" / "第二天不要博物馆") updates it instead of
          // starting from scratch.
          chatHistory.push({ role: "user", content: body.query });
          chatHistory.push({ role: "assistant", content: ev.answer.slice(0, 2000) });
          // Make the itinerary saveable/exportable like a conversation.
          savedTurns.push({
            query: body.query, answer: ev.answer,
            sources: (ev.stops || []).map(s => ({ file: s.file, heading: s.heading })),
          });
          saveChat();
          $("query").value = "";
        } else if (ev.type === "error") {
          throw new Error(ev.detail);
        }
      }
    }
  } finally {
    clearInterval(timer);
  }
}

async function run() {
  const mode = document.querySelector("input[name=mode]:checked").value;
  if (mode === "route") {
    $("go").disabled = true;
    try { await runRoute(); }
    catch (e) { status("Error: " + esc(e.message), true); }
    finally { $("go").disabled = false; }
    return;
  }
  if (mode === "xray") { await runXray(); return; }
  const query = $("query").value.trim();
  if (!query) return;
  $("hero").style.display = "none";
  const body = {
    query,
    top_k: 5,
    collection: $("collection").value || null,
    category: $("category").value.trim() || null,
    geo: geoFilter,
  };
  $("go").disabled = true;
  const t0 = Date.now();
  try {
    // One box, three pipelines: a cheap deterministic classifier picks
    // plan / reach / ask (ask detects plain A-to-B routing itself).
    // Classification is best-effort; any failure just means ask.
    status(`<span class="spin"></span>Detecting intent…`);
    let intent = { kind: "ask" };
    try {
      const r = await api("/intent", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, collection: $("collection").value }),
      });
      if (r.ok) intent = await r.json();
    } catch {}
    if (intent.kind === "along") {
      // "From A to B, what's on the way" — corridor search as a chat turn:
      // route drawn, detour-worthy stops pinned, photos on hover.
      status(`<span class="spin"></span>🚗 ${esc(intent.from_place)} → ${esc(intent.to_place)}, scanning the corridor…`);
      const turn = el("div");
      turn.innerHTML = `<div class="card bubble-user"><p>${esc(query)}</p></div>`
        + `<div class="card t-answer" style="display:none"><p></p></div>`
        + `<div class="t-along"></div>`;
      $("results").prepend(turn);
      const resp = await api("/plan/along", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from_place: intent.from_place,
                               to_place: intent.to_place,
                               interests: intent.interests,
                               query,
                               collection: $("collection").value }),
      });
      const d = await resp.json();
      if (!resp.ok) throw new Error(d.detail || resp.statusText);
      if (d.answer) {
        const card = turn.querySelector(".t-answer");
        card.style.display = "";
        card.querySelector("p").textContent = d.answer;
      }
      renderAlongResult(d, turn.querySelector(".t-along"));
      status(`${esc(d.from.name)} → ${esc(d.to.name)}: ${d.stops.length} stop(s) within ${d.corridor_km} km of the route.`);
      // Corridor turns join the conversation memory like any other answer,
      // so a follow-up ("第二个多远?") has this context.
      chatHistory.push({ role: "user", content: query });
      chatHistory.push({ role: "assistant",
                         content: (d.answer || d.stops.map(s => s.file).join(", ")).slice(0, 2000) });
      savedTurns.push({ query, answer: d.answer || "",
                        sources: d.stops.map(s => ({ file: s.file, heading: s.heading })) });
      saveChat();
      $("query").value = "";
    } else if (intent.kind === "plan") {
      await runPlanStream(body, t0);
    } else if (intent.kind === "reach") {
      status(`→ 🎨 Reach: ${intent.minutes} min around ${esc(intent.place)}`);
      await runReachSearch({ query, minutes: intent.minutes, place: intent.place });
      $("query").value = "";
    } else {
      await runAskStream(body, t0);
    }
  } catch (e) {
    status("Error: " + esc(e.message), true);
  } finally {
    $("go").disabled = false;
  }
}

$("go").onclick = run;
$("goroute").onclick = () => run();
$("query").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("to").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

// "顺路看" only makes sense for a drive (needs the route geometry). Ticking it
// enables the interest box and forces car mode.
$("along").addEventListener("change", e => {
  $("alongwhat").disabled = !e.target.checked;
  if (e.target.checked) { $("rmode").value = "car"; $("rmode").disabled = true; }
  else { $("rmode").disabled = false; }
});
$("alongwhat").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

document.querySelectorAll("input[name=mode]").forEach(r =>
  r.addEventListener("change", () => {
    if (!r.checked) return;
    const isRoute = r.value === "route";
    const isReach = r.value === "reach";
    const isAuto = r.value === "auto";
    $("searchbar").style.display = (isRoute || isReach) ? "none" : "flex";
    $("routebar").style.display = isRoute ? "flex" : "none";
    $("reachbar").style.display = isReach ? "flex" : "none";
    // Conversation trimmings and retrieval filters belong to Auto only:
    // X-ray shares the input box but is a diagnostic, not a conversation.
    $("chattools").style.display = isAuto ? "inline-flex" : "none";
    $("filterbar").style.display = isAuto ? "flex" : "none";
    $("query").placeholder = r.value === "xray"
      ? "Type a query to see how dense, sparse, RRF and rerank pick the results"
      : "Ask anything — a question, a trip (“day trip around Essen”), a reach (“castles within 90 min”)";
    if (isRoute || isReach) ensureMap();
    // X-ray shows a side-by-side pipeline, not the map or a conversation.
    if (r.value === "xray") {
      $("map").style.display = "none";
      $("layout").classList.remove("with-map");
      $("results").innerHTML = "";
    }
    // Leaving reach mode clears the paint so it doesn't linger over results.
    if (!isReach && reachLayer) {
      reachLayer.clearLayers();
      if (reachLegend) { map.removeControl(reachLegend); reachLegend = null; }
    }
    updateHero();
  }));

$("goreach").onclick = () => runIsochrone();
$("reachfrom").addEventListener("keydown", e => { if (e.key === "Enter") runIsochrone(); });
$("goreachq").onclick = () => runReachSearch();
$("reachq").addEventListener("keydown", e => { if (e.key === "Enter") runReachSearch(); });

$("geobtn").onclick = () => {
  if (geoFilter || picking) {           // clear
    geoFilter = null; picking = false;
    $("geobtn").classList.remove("active");
    $("radius").style.display = "none";
    if (geoLayer) geoLayer.clearLayers();
    status("Location filter cleared.");
  } else {                              // arm picking
    picking = true;
    $("geobtn").classList.add("active");
    $("radius").style.display = "";
    ensureMap();
    status("Click the map to set the search center.");
  }
};
$("radius").onchange = () => {
  if (geoFilter) {
    geoFilter.radius_km = parseFloat($("radius").value);
    drawGeoFilter();
  }
};

function resetChat() {
  chatHistory = [];
  savedTurns = [];
  localStorage.removeItem(CHAT_KEY);
  $("results").innerHTML = "";
  status("New conversation.");
  updateHero();
}
$("newchat").onclick = resetChat;

// Example chips: one per pipeline; clicking one runs it for real.
document.querySelectorAll(".chip").forEach(chip => chip.onclick = () => {
  $("query").value = chip.textContent;
  run();
});
$("loginbtn").onclick = doLogin;
$("lp").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

// ---- Server-side conversations ----
async function saveConversation() {
  if (!savedTurns.length) { status("Nothing to save yet."); return; }
  const messages = [];
  for (const t of savedTurns) {
    if (!t.answer) continue;
    messages.push({ role: "user", content: t.query });
    messages.push({ role: "assistant", content: t.answer,
      sources: (t.sources || []).map(s => `${s.file} :: ${s.heading}`).join("; ") });
  }
  const title = savedTurns[savedTurns.length - 1].query.slice(0, 40);
  const resp = await api("/conversations", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ collection: $("collection").value, title, messages }),
  });
  const d = await resp.json();
  // Offer the markdown export so a plan or chat can flow back into the vault.
  const url = "/conversations/" + d.id + "/export";
  $("status").innerHTML = `Saved as #${d.id}. ` +
    `<a href="#" id="exportlink">Export markdown</a> to fold it back into your notes.`;
  const link = document.getElementById("exportlink");
  if (link) link.onclick = async (e) => {
    e.preventDefault();
    const r = await api(url);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `plan-${d.id}.md`;
    a.click();
  };
  loadHistory();
}

async function loadHistory() {
  try {
    const list = await (await api("/conversations")).json();
    $("history").innerHTML = '<option value="">History…</option>' +
      list.map(c => `<option value="${c.id}">${esc(c.title)} · ${c.updated_at.slice(5, 16).replace("T", " ")}</option>`).join("");
  } catch { /* not logged in yet */ }
}

async function openConversation(cid) {
  const d = await (await api("/conversations/" + cid)).json();
  resetChat();
  for (const m of d.messages) {
    if (m.role === "user") {
      savedTurns.push({ query: m.content, answer: "", sources: [] });
    } else if (savedTurns.length) {
      const t = savedTurns[savedTurns.length - 1];
      t.answer = m.content;
      t.sources = (m.sources || "").split("; ").filter(Boolean).map(s => {
        const [file, heading] = s.split(" :: ");
        return { file, heading: heading || "" };
      });
    }
  }
  $("results").innerHTML = "";
  for (const t of savedTurns) {
    restoreTurn(t);
    chatHistory.push({ role: "user", content: t.query });
    chatHistory.push({ role: "assistant", content: (t.answer || "").slice(0, 2000) });
  }
  saveChat();
  status(`Loaded conversation #${cid}. Add to it, or ↺ New to start fresh.`);
}

$("savechat").onclick = () => saveConversation().catch(e => status("Error: " + esc(e.message), true));
$("history").onchange = e => { if (e.target.value) openConversation(e.target.value); };
$("collection").addEventListener("change", () => { resetChat(); savePrefs(); });
document.querySelectorAll("input[name=mode]").forEach(r =>
  r.addEventListener("change", savePrefs));

async function init() {
  const prefs = loadJSON(PREF_KEY);
  if (prefs.mode) {
    // A saved mode that no longer exists (search/ask/plan were folded into
    // Auto) silently falls back to the default.
    const radio = document.querySelector(`input[name=mode][value="${prefs.mode}"]`);
    if (radio && !radio.checked) radio.click();
  }
  await loadCollections();
  // Setting the value directly avoids the change handler, which resets the chat.
  if (prefs.collection &&
      [...$("collection").options].some(o => o.value === prefs.collection)) {
    $("collection").value = prefs.collection;
  }
  restoreChat();
  loadHistory();
  updateHero();
}
init();
</script>
